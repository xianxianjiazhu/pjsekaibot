name: 發送排行預測到噗浪

on:
  schedule:
    # UTC 0:00~16:00 每小時一次 = 台灣時間 08:00 ~ 隔天 00:00
    # 現在主力是 Cloudflare Workers 準時觸發 workflow_dispatch，
    # 這裡只當備援（萬一 Cloudflare 那次沒觸發成功），
    # 密度不用拉太高，避免跟 Cloudflare 的觸發疊在一起、把55分鐘防重複窗口撐爆
    - cron: "0 0-16 * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "強制執行（忽略活動期間檢查，測試用）"
        type: boolean
        default: false

jobs:
  check-date:
    runs-on: ubuntu-latest
    outputs:
      in_range: ${{ steps.check.outputs.in_range }}
    steps:
      - name: 向 Apps Script 查詢目前活動的 start_at / aggregate_at，判斷現在該不該發文
        id: check
        env:
          STATUS_URL: "https://script.google.com/macros/s/AKfycbxyJhVqGpCAQ5upZlflj6FopumGh14gjzHXBTO1nXATHUdGWD1JUNMPMQQ8_ND7CXZffQ/exec?mode=proxy&target=top100"
        run: |
          RESPONSE=$(curl -sL --max-time 30 "$STATUS_URL")
          CURL_EXIT=$?
          if [[ $CURL_EXIT -ne 0 ]]; then
            echo "curl 逾時或失敗（exit code $CURL_EXIT），可能是 Apps Script 或 HiSekai API 沒回應，這次跳過"
            echo "in_range=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "回傳內容（節錄）：$(echo "$RESPONSE" | head -c 300)"

          START_AT=$(echo "$RESPONSE" | jq -r '.start_at // empty')
          AGGREGATE_AT=$(echo "$RESPONSE" | jq -r '.aggregate_at // empty')

          if [[ -z "$START_AT" || -z "$AGGREGATE_AT" ]]; then
            echo "抓不到 start_at / aggregate_at（可能活動資料異常或 API 暫時失敗），這次先跳過，不發文"
            echo "in_range=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOW_EPOCH=$(date -u +%s)
          START_EPOCH=$(date -u -d "$START_AT" +%s)
          AGGREGATE_EPOCH=$(date -u -d "$AGGREGATE_AT" +%s)
          # 活動開始滿3小時才開始發文，避免開場資料還沒穩定就發出去
          MIN_START_EPOCH=$((START_EPOCH + 3 * 3600))

          # 獨立檢查現在的台灣時間是不是在 08:00~24:00 之間，不管是哪個排程來源、
          # 延遲多久才觸發都要守住這道防線（之前發生過 GitHub 排程延遲，
          # 導致原本該 00:00 觸發的排程拖到凌晨1點才真的執行、照樣發文的狀況）。
          # 有效時段是台灣時間 8~23 點，加上代表「24:00」那個時刻的 0 點整（每天最後一次）。
          TW_HOUR=$(TZ="Asia/Taipei" date -d "@$NOW_EPOCH" +%-H)
          TW_TIME_STR=$(TZ="Asia/Taipei" date -d "@$NOW_EPOCH" "+%Y-%m-%d %H:%M:%S")
          if [[ "$TW_HOUR" -ge 8 || "$TW_HOUR" -eq 0 ]]; then
            IN_ACTIVE_HOURS=true
          else
            IN_ACTIVE_HOURS=false
          fi
          echo "現在台灣時間：$TW_TIME_STR，是否在發文時段(08:00~24:00)內：$IN_ACTIVE_HOURS"

          echo "現在（UTC）：$(date -u -d "@$NOW_EPOCH")"
          echo "活動開始：$(date -u -d "@$START_EPOCH")，預測截止（結算時間）：$(date -u -d "@$AGGREGATE_EPOCH")"
          echo "開始發文門檻（活動開始+3小時）：$(date -u -d "@$MIN_START_EPOCH")"

          if [[ "$IN_ACTIVE_HOURS" != "true" ]]; then
            echo "現在不在台灣時間 08:00~24:00 的發文時段內，跳過這次發文"
            echo "in_range=false" >> "$GITHUB_OUTPUT"
          elif [[ "$NOW_EPOCH" -ge "$MIN_START_EPOCH" && "$NOW_EPOCH" -lt "$AGGREGATE_EPOCH" ]]; then
            echo "在活動預測期間內（已過開場3小時緩衝），檢查最近有沒有剛發過文..."

            # 因為 GitHub 自己的 schedule 跟 Cloudflare 準時觸發可能疊在一起，
            # 這裡查「最近55分鐘內」有沒有已經發過文，避免重複發文
            # （留5分鐘餘裕給下一輪整點，不會卡到下次該發的時機）
            RECENT_URL="https://script.google.com/macros/s/AKfycbxyJhVqGpCAQ5upZlflj6FopumGh14gjzHXBTO1nXATHUdGWD1JUNMPMQQ8_ND7CXZffQ/exec?mode=trackedPlurks&hours=0.92"
            RECENT_RESPONSE=$(curl -sL --max-time 30 "$RECENT_URL")
            RECENT_COUNT=$(echo "$RECENT_RESPONSE" | jq -r '.plurkIds | length // 0' 2>/dev/null || echo "0")

            if [[ "$RECENT_COUNT" -gt 0 ]]; then
              echo "最近55分鐘內已經發過文了（$RECENT_COUNT 則），這次跳過避免重複發文"
              echo "in_range=false" >> "$GITHUB_OUTPUT"
            else
              echo "最近55分鐘內沒發過文，繼續發文"
              echo "in_range=true" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$NOW_EPOCH" -ge "$START_EPOCH" && "$NOW_EPOCH" -lt "$MIN_START_EPOCH" ]]; then
            echo "活動剛開始不到3小時，開場資料還不穩定，先跳過"
            echo "in_range=false" >> "$GITHUB_OUTPUT"
          else
            echo "不在活動預測期間內（尚未開始或已結算），跳過這次發文"
            echo "in_range=false" >> "$GITHUB_OUTPUT"
          fi

  post-prediction:
    needs: check-date
    if: needs.check-date.outputs.in_range == 'true' || github.event.inputs.force_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安裝相依套件
        run: npm install

      - name: 安裝 Playwright 瀏覽器（Chromium）
        run: npx playwright install --with-deps chromium

      - name: 截圖並發送到噗浪
        env:
          PLURK_APP_KEY: ${{ secrets.PLURK_APP_KEY }}
          PLURK_APP_SECRET: ${{ secrets.PLURK_APP_SECRET }}
          PLURK_ACCESS_TOKEN: ${{ secrets.PLURK_ACCESS_TOKEN }}
          PLURK_ACCESS_SECRET: ${{ secrets.PLURK_ACCESS_SECRET }}
          TARGET_URL: "https://xianxianjiazhu.github.io/pjsekai/score_predict.html"
          SHARE_BUTTON_SELECTOR: "#shareImageBtn"
          APPS_SCRIPT_BASE_URL: "https://script.google.com/macros/s/AKfycbxyJhVqGpCAQ5upZlflj6FopumGh14gjzHXBTO1nXATHUdGWD1JUNMPMQQ8_ND7CXZffQ/exec"
        run: node scripts/post-to-plurk.js

      - name: 上傳截圖供除錯（可選）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-preview
          path: prediction-preview.png
          retention-days: 7
