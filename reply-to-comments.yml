name: 回覆噗浪留言查詢

on:
  schedule:
    # 每 10 分鐘一次；GitHub Actions 的 cron 不保證準時，尖峰時段可能會晚個幾分鐘
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  reply-comments:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安裝相依套件
        run: npm install

      - name: 輪詢留言並回覆
        env:
          PLURK_APP_KEY: ${{ secrets.PLURK_APP_KEY }}
          PLURK_APP_SECRET: ${{ secrets.PLURK_APP_SECRET }}
          PLURK_ACCESS_TOKEN: ${{ secrets.PLURK_ACCESS_TOKEN }}
          PLURK_ACCESS_SECRET: ${{ secrets.PLURK_ACCESS_SECRET }}
          APPS_SCRIPT_BASE_URL: "https://script.google.com/macros/s/AKfycbxyJhVqGpCAQ5upZlflj6FopumGh14gjzHXBTO1nXATHUdGWD1JUNMPMQQ8_ND7CXZffQ/exec"
          TRACK_WINDOW_HOURS: "48"
        run: node scripts/reply-to-comments.js
