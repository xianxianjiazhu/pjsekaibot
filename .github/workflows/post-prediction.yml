name: 發送排行預測到噗浪

on:
  schedule:
    # cron 是 UTC 時間，台灣時間 = UTC + 8
    # UTC 0:00~16:00 每小時一次 = 台灣時間 08:00 ~ 隔天 00:00 每小時一次
    - cron: "0 0-16 * * *"
  workflow_dispatch: {}   # 讓你可以在 GitHub 網頁上手動按「Run workflow」測試

jobs:
  check-date:
    runs-on: ubuntu-latest
    outputs:
      in_range: ${{ steps.check.outputs.in_range }}
    steps:
      - name: 向 Apps Script 查詢目前活動的 start_at / aggregate_at，判斷現在該不該發文
        id: check
        env:
          STATUS_URL: "https://script.google.com/macros/s/AKfycbxyJhVqGpCAQ5upZlflj6FopumGh14gjzHXBTO1nXATHUdGWD1JUNMPMQQ8_ND7CXZffQ/exec?mode=proxy&target=top100"
        run: |
          RESPONSE=$(curl -s "$STATUS_URL")
          echo "回傳內容（節錄）：$(echo "$RESPONSE" | head -c 300)"

          START_AT=$(echo "$RESPONSE" | jq -r '.start_at // empty')
          AGGREGATE_AT=$(echo "$RESPONSE" | jq -r '.aggregate_at // empty')

          if [[ -z "$START_AT" || -z "$AGGREGATE_AT" ]]; then
            echo "抓不到 start_at / aggregate_at（可能活動資料異常或 API 暫時失敗），這次先跳過，不發文"
            echo "in_range=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOW_EPOCH=$(date -u +%s)
          START_EPOCH=$(date -u -d "$START_AT" +%s)
          AGGREGATE_EPOCH=$(date -u -d "$AGGREGATE_AT" +%s)

          echo "現在（UTC）：$(date -u -d "@$NOW_EPOCH")"
          echo "活動開始：$(date -u -d "@$START_EPOCH")，預測截止（結算時間）：$(date -u -d "@$AGGREGATE_EPOCH")"

          if [[ "$NOW_EPOCH" -ge "$START_EPOCH" && "$NOW_EPOCH" -lt "$AGGREGATE_EPOCH" ]]; then
            echo "在活動預測期間內，繼續發文"
            echo "in_range=true" >> "$GITHUB_OUTPUT"
          else
            echo "不在活動預測期間內（尚未開始或已結算），跳過這次發文"
            echo "in_range=false" >> "$GITHUB_OUTPUT"
          fi

  post-prediction:
    needs: check-date
    if: needs.check-date.outputs.in_range == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安裝相依套件
        run: npm install

      - name: 安裝 Playwright 瀏覽器（Chromium）
        run: npx playwright install --with-deps chromium

      - name: 截圖並發送到噗浪
        env:
          PLURK_APP_KEY: ${{ secrets.PLURK_APP_KEY }}
          PLURK_APP_SECRET: ${{ secrets.PLURK_APP_SECRET }}
          PLURK_ACCESS_TOKEN: ${{ secrets.PLURK_ACCESS_TOKEN }}
          PLURK_ACCESS_SECRET: ${{ secrets.PLURK_ACCESS_SECRET }}
          TARGET_URL: "https://xianxianjiazhu.github.io/pjsekai/score_predict.html"
          SHARE_BUTTON_SELECTOR: "#shareImageBtn"
          APPS_SCRIPT_BASE_URL: "https://script.google.com/macros/s/AKfycbxyJhVqGpCAQ5upZlflj6FopumGh14gjzHXBTO1nXATHUdGWD1JUNMPMQQ8_ND7CXZffQ/exec"
        run: node scripts/post-to-plurk.js

      - name: 上傳截圖供除錯（可選）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-preview
          path: prediction-preview.png
          retention-days: 7
